
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
  <title>Lexicon AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0b0d11',
            surface: '#13161c',
            surfaceHighlight: '#1e232b',
            primary: '#429ada',
            secondary: '#194394',
            text: '#e3e3e3',
            muted: '#9ca3af',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0d11;
      color: #e3e3e3;
      -webkit-font-smoothing: antialiased;
    }
    .font-display {
      font-family: 'Outfit', sans-serif;
    }
    .glass-panel {
      background: rgba(19, 22, 28, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Custom focus states for sleek feel */
    input:focus, textarea:focus {
      outline: none;
      border-color: #429ada !important;
      box-shadow: 0 0 0 2px rgba(66, 154, 218, 0.2);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0d11; 
    }
    ::-webkit-scrollbar-thumb {
      background: #1e232b; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #429ada; 
    }

    @media print {
      body {
        background-color: white !important;
        color: black !important;
        font-family: 'Inter', sans-serif !important;
      }
      .print\:hidden {
        display: none !important;
      }
      header, footer, button, .no-print {
        display: none !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
    }

    /* Markdown Styles */
    .markdown-body {
      color: inherit;
      font-family: inherit;
    }
    .markdown-body p {
      margin-bottom: 0.5rem;
    }
    .markdown-body p:last-child {
      margin-bottom: 0;
    }
    .markdown-body strong {
      font-weight: 700;
      color: #fff;
    }
    .markdown-body em {
      font-style: italic;
      color: #a855f7;
    }
    .markdown-body ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .markdown-body li {
      margin-bottom: 0.25rem;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
