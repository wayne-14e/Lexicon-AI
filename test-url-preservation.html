<!DOCTYPE html>
<html>
<head>
    <title>Test URL Preservation</title>
</head>
<body>
    <h1>URL Preservation Test</h1>
    <p>This page tests the URL parameter functionality.</p>
    
    <h2>Test Links:</h2>
    <ul>
        <li><a href="?view=collections">Collections Page</a></li>
        <li><a href="?view=profile">Profile Page</a></li>
        <li><a href="?view=scratchpad">Scratchpad Page</a></li>
        <li><a href="?">Home Page (clear params)</a></li>
    </ul>
    
    <h2>Current URL Parameters:</h2>
    <div id="params"></div>
    
    <script>
        function displayParams() {
            const params = new URLSearchParams(window.location.search);
            const view = params.get('view');
            const table = params.get('table');
            
            const paramsDiv = document.getElementById('params');
            paramsDiv.innerHTML = `
                <p><strong>view:</strong> ${view || 'null'}</p>
                <p><strong>table:</strong> ${table || 'null'}</p>
                <p><strong>Full URL:</strong> ${window.location.href}</p>
            `;
        }
        
        displayParams();
        
        // Update display when URL changes
        window.addEventListener('popstate', displayParams);
    </script>
</body>
</html>
